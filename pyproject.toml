[project]
name = "stream-micro"
version = "0.1.0"
description = "Display Ollama quota usage on two Stream Deck keys"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Pillow>=10,<13",
  "pystray>=0.19,<1; sys_platform == 'win32'",
  "PyYAML>=6,<7",
  "streamdeck>=0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
stream-micro = "stream_micro.cli:main"

[dependency-groups]
packaging = ["pyinstaller>=6,<7"]
dev = [
  "pyright>=1.1,<2",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_micro"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
